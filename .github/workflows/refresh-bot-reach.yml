name: Refresh Sepulchre bot reach

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: sepulchre-reach-data-branch
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Sepulchrebot/sepulchrebot.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out website (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Discord gateway client
        run: python -m pip install 'discord.py>=2.4,<3'
      - name: Gather verified bot statistics (no command writes)
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python .github/scripts/export_bot_reach.py
      - name: Publish JSON to bot-reach-data ONLY
        run: python .github/scripts/publish_bot_reach_data.py
